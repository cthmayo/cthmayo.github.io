short_bio: >-
  <p>
    I am a medical doctor and data scientist specialising in machine learning
    for healthcare. I currently work as a Data Science Fellow at Te Whatu Ora
    | Health New Zealand and am an incoming PhD student and Woolf Fisher Scholar
    at the University of Cambridge.
  </p>
  <p>
    Before moving into full-time research and data science, I worked clinically
    as a house officer at Waikato Hospital. My clinical experience included
    haematology, orthopaedics, general surgery, respiratory medicine, public
    health, and cardiothoracic surgery.
  </p>
  <p>
    My research interests include multimodal machine learning, clinical risk
    prediction, causal machine learning, and physiological signal and medical
    image processing.
  </p>
  <p>
    I sometimes <a href="https://greavierge.itch.io/">make games</a> as part of game jams.
  </p>

