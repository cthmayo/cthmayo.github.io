short_bio: >-
  <p>
    I am a medical doctor and data scientist specialising in the development and
    evaluation of machine learning methods for healthcare. I am currently a Data
    Science Fellow at Te Whatu Ora (Health New Zealand) and have recently completed a
    Master of Science (Research) in Artificial Intelligence at the University of
    Waikato. I am an incoming PhD student and Woolf Fisher scholar at the University
    of Cambridge.
  </p>
  <p>
    My research interests multimodal machine learning, risk prediction,
    causal machine learning, and signal/image processing for healthcare.
  </p>

